services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vault-backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/vault_data
    ports:
      - "127.0.0.1:8005:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://api.vault.shahidur.dev
    container_name: vault-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3005:3000"
    depends_on:
      - backend

networks:
  default:
    name: vault-network
